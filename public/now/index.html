<h1></h1>




<nav class="segmented" role="tablist">
  
    <button type="button" role="tab" data-target="panel-0"
      class="active"
      aria-selected="true">Math</button>
  
    <button type="button" role="tab" data-target="panel-1"
      class=""
      aria-selected="false">Reading</button>
  
    <button type="button" role="tab" data-target="panel-2"
      class=""
      aria-selected="false">Writing</button>
  
</nav>


  <section id="panel-0" class="about-panel" role="tabpanel">
    
  </section>

  <section id="panel-1" class="about-panel" role="tabpanel" hidden>
    
  </section>

  <section id="panel-2" class="about-panel" role="tabpanel" hidden>
    
  </section>


<script>
  const tabs = document.querySelectorAll('.segmented button');
  const panels = document.querySelectorAll('.about-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      panels.forEach(p => p.hidden = true);
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      document.getElementById(tab.dataset.target).hidden = false;
    });
  });
</script>
