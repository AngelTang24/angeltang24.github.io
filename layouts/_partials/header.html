<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}" />
    {{ partial "head_custom.html" . }}
  </head>
  
  <body>
  <div id="wrapper">
	  <header id="layout-header">
		  <div class="main-header-pic">
			  <img src="{{ "images/penguins-landscape-solid.png" | relURL }}" alt="penguin landscape">
		  </div>
		  
		  <div class="main-header-text">
			  <h1>The OG Penguin</h1>
		  </div>
	  </header>
	  
	  <aside id="layout-nav">
		  <nav class="main-menu">
			  <ul class="menu">
				  {{ $currentPage := . }}
				  {{ range .Site.Menus.main }}
					{{ $isActive := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}
					<li><a href="{{ .URL | relURL }}" class="nav-link{{ if $isActive }} active{{ end }}">{{ .Name }}</a></li>
				  {{ end }}
			  </ul>
		  </nav>
	  </aside>
	  
	  <article id="layout-content">
